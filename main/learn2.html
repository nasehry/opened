<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            display:none;
            margin:0px;
            background-color:#121212;
            overflow-x:hidden;
        }

        #ParentDiv{
            display:flex;
            justify-content:start;
            align-items:center;
            flex-direction:column;
            left:0;
            top:0;
            width:100vw;
            height:100vh;
            background-color:#121212;
            
        }

        .OfflineGameButton {
            display: flex;
            flex-direction: row;
            align-items: end;
            justify-content: center;
            flex-shrink:1;
            min-width: 80px;
            max-width: 150px;
            aspect-ratio: 1 / 1;
            height: auto;
            width:auto;
            font-size:15cqmin;
            color:#f7f7f7;;
            background-color:#1e1e1e;
            border-color:#2d2d2d;
            border-width:5px;
            text-shadow:#f7f7f7;
            box-sizing: border-box;
            flex:1 1 0;
            container-type: size;
        }

        .OfflineGameButton-text{
            font-size:20cqmin;
            color:#f7f7f7;
            text-shadow:#f7f7f7;

        }

        #GameList {
            width:100%;
            height:100%;
            flex: 1 1 0;
            display:flex;
            flex-direction:row;
            gap:5px;
            flex-wrap:wrap;
        }


        #TopNav {
            position:relative;
            width:100%;
            height:10%;
            display:flex;
            left:0px;
            top:0px;
            background-color:#4B0082;
            align-items: center;
        }

        .TopNav-button {
            flex:1;
            width:fit-content;
            /* the right part of the calc is the margin for the top and bottom / 2 */
            height:calc(100% - 10px);
            margin:5px;
            background-color:#8a2be2;
            border-color:#8a2be2;
            text-size-adjust: inherit;
            font-size: calc(5vh - 14px);
            font-family:Georgia, 'Times New Roman', Times, serif;  
        }

        .TopNav-button:hover {
            opacity:80%;
        }
    </style>

<script>
(async () => {
    const params = new URLSearchParams(location.search);
    const encoded = params.get("t");
    const hasE = params.has("e");

    let validTimestamp = false;

    try {
        const bytes = Uint8Array.from(
            atob(encoded),
            c => c.charCodeAt(0)
        );

        if (bytes.length === 8) {
            const timestamp = Number(
                new DataView(bytes.buffer).getBigUint64(0, true)
            );

            const now = Math.floor(Date.now() / 1000);

            validTimestamp =
                timestamp <= now &&
                now - timestamp < 86400;
        }
    } catch (e) {}

    let ipAuthorized = false;

    if (hasE && validTimestamp) {
        try {
            const response = await fetch("https://httpbin.org/ip");
            if (!response.ok) throw new Error("IP lookup failed");

            const data = await response.json();
            const ip = data.origin.trim().split(",")[0];

            const hashBuffer = await crypto.subtle.digest(
                "SHA-256",
                new TextEncoder().encode(ip)
            );

            const hash = Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");

            ipAuthorized = hash.startsWith("e0614bf95e");
        } catch (e) {}
    }

    function updateOverlay() {
        const allowed =
            validTimestamp &&
            (ipAuthorized || !navigator.onLine);

        let overlay = document.getElementById("blackOverlay");

        if (!allowed && !overlay) {
            overlay = document.createElement("div");
            overlay.id = "blackOverlay";

            Object.assign(overlay.style, {
                position: "fixed",
                inset: "0",
                width: "100vw",
                height: "100vh",
                background: "black",
                zIndex: "2147483647"
            });

            document.documentElement.appendChild(overlay);
        } else if (allowed && overlay) {
            overlay.remove();
        }
    }

    window.addEventListener("online", updateOverlay);
    window.addEventListener("offline", updateOverlay);

    updateOverlay();
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Games</title>

</head>
<body>
    <div id="ParentDiv">
    <div id="TopNav">
        <button class="TopNav-button" onclick="window.location.href='offline_games.html' + window.location.search;"> Offline Games </button>
        <button class="TopNav-button" onclick="window.location.href='offline_games-src2.html' + window.location.search;"> Offline Games Source 2 </button>
        <button class="TopNav-button" onclick="window.location.href='tools.html' + window.location.search;"> Tools </button>
    </div>

    <h1 style="color:#f7f7f7;"> Offline games! </h1>

    <div id="GameList">

    </div>
    </div>

    <script>

        const games = [
        "brotato-new",
        "idle-dice",
        "n-gon",
        "clover-pit",
        "balatro-port",
        "undertale",
        "celeste",
        "idle-research",
        "deltarune",
        "Minecraft 26.2 Version"
];

        const FileUrl = [
            "brotato-new.html",
            "idle-dice.html",
            "n-gon/index.html",
            "clover-pit.html",
            "balatro-port/index.html",
            "undertale/index.html",
            "celeste/index.html",
            "idle-research/index.html",
            "deltarune-main/deltarune-main/index.html",
            "eg.html"
        ]

        const gameList = document.getElementById("GameList");

        games.forEach(function(gameFile, index) {

            // Create a button
            const button = document.createElement("button");
            button.className = "OfflineGameButton";
            // Turn the filename into the button's name
            let gameName = gameFile;

            // Remove .html
            gameName = gameName.replace(/\.html$/i, "");

            // Replace - and _ with spaces
            gameName = gameName.replace(/[-_]/g, " ");

            // Capitalize the first letter of each word
            gameName = gameName.replace(/\b\w/g, function(letter) {
                return letter.toUpperCase();
            });

            // Set the button text

            let p_tag = document.createElement("p")
            p_tag.textContent = gameName
            p_tag.className= "OfflineGameButton-text"

            button.appendChild(p_tag)


            // When the button is clicked,
            // open the game from the offline folder
            button.onclick = async function() {
                if (gameFile.toLowerCase() === "n-gon") {
                    window.location.href = "https://puffcodewebsite.b-cdn.net/other_offline-html/n-gon/index.html";
                    return;
                }

                window.location.href = "../other_offline-html/" + FileUrl[index]
                
            };

            // Add the button to the page
            gameList.appendChild(button);

            // Put a space after each button
            gameList.appendChild(document.createTextNode(" "));
        });

        function LoadStash() {
            window.location.href = "game_stash.html";
        }
    </script>

</body>
</html>
